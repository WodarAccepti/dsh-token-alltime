name: Release

# 由 tag 触发：git tag v1.0.0 && git push origin v1.0.0
# 不发布到 npm：默认只用 GitHub Release 分发。要发 npm 就先配 NPM_TOKEN
# 再把 npm publish 步骤加回来（包名 dsh-token-alltime 在 npm 上是空闲的，见 README「发版」）。
# 这里只把仓库里的 release/*.tgz、release/*-source.zip、SHA256SUMS 挂到 GitHub Release。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: attach release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run smoke test
        run: node tests/smoke.mjs
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e "const v=require('./package.json').version, t=process.env.GITHUB_REF_NAME.replace(/^v/,''); if (v!==t) throw new Error('tag ' + t + ' !== package version ' + v)"
      - name: Attach artifacts to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release/*.tgz release/*.zip release/SHA256SUMS)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::notice::release/ 里还没有产物：先在本机跑 node tools/pack-release.mjs 并把 release/ 提交上来"
            exit 0
          fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
